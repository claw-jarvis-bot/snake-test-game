<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake Test Game</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <div class="wood-frame top"></div>
    <h1>Classic Snake</h1>
    <p class="subtitle">Use arrow keys, WASD, or touch controls.</p>
    <div class="hud">
      <span class="hud-pill">Score: <strong id="score">0</strong></span>
      <button id="restart">Restart</button>
    </div>
    <div class="cabinet">
      <div class="wood-frame left"></div>
      <canvas id="game" width="400" height="400" aria-label="Snake game board"></canvas>
      <div class="wood-frame right"></div>
    </div>
    <div class="controls" aria-label="Mobile controls">
      <button class="control up" data-dir="up">▲</button>
      <div class="controls-row">
        <button class="control" data-dir="left">◀</button>
        <button class="control" data-dir="down">▼</button>
        <button class="control" data-dir="right">▶</button>
      </div>
    </div>
    <p id="message">Eat the food to grow. Avoid the walls and yourself.</p>
    <div class="wood-frame bottom"></div>
  </main>
  <script src="script.js"></script>
</body>
</html>
