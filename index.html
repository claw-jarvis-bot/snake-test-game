<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake Test Game</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="phone-shell">
    <div class="top-cap">
      <div class="speaker"></div>
    </div>
    <section class="screen-wrap">
      <div class="screen-header">
        <span>SNAKE</span>
        <span><strong id="score">0</strong></span>
      </div>
      <canvas id="game" width="84" height="48" aria-label="Snake game board"></canvas>
      <p id="message">READY</p>
    </section>
    <div class="softkeys">
      <button id="restart" class="softkey">START</button>
    </div>
    <div class="controls" aria-label="Mobile controls">
      <button class="control up" data-dir="up">▲</button>
      <div class="controls-row">
        <button class="control" data-dir="left">◀</button>
        <button class="control center" data-dir="down">OK</button>
        <button class="control" data-dir="right">▶</button>
      </div>
      <button class="control down-wide" data-dir="down">▼</button>
    </div>
    <div class="keypad-grid" aria-hidden="true">
      <span>1</span><span>2</span><span>3</span>
      <span>4</span><span>5</span><span>6</span>
      <span>7</span><span>8</span><span>9</span>
      <span>*</span><span>0</span><span>#</span>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
