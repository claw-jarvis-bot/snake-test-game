<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake Test Game</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="phone-photo-layout">
    <div class="phone-photo-frame">
      <img class="phone-photo" src="assets/nokia-reference.jpg" alt="Nokia phone" />

      <section class="screen-overlay" aria-label="Snake screen">
        <div class="screen-meta-ui">
          <span>SNAKE</span>
          <span><strong id="score">0</strong></span>
        </div>
        <canvas id="game" width="84" height="48" aria-label="Snake game board"></canvas>
        <p id="message">READY</p>
      </section>

      <button id="restart" class="hotspot start-hotspot" aria-label="Start"></button>
      <button class="hotspot up-hotspot control" data-dir="up" aria-label="Up"></button>
      <button class="hotspot left-hotspot control" data-dir="left" aria-label="Left"></button>
      <button class="hotspot right-hotspot control" data-dir="right" aria-label="Right"></button>
      <button class="hotspot down-hotspot control" data-dir="down" aria-label="Down"></button>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
