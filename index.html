<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <section class="game-panel">
      <div class="hud">
        <h1>Tetris</h1>
        <div class="stats">
          <span>Score: <strong id="score">0</strong></span>
          <button id="restart">Restart</button>
        </div>
      </div>

      <div class="game-wrap">
        <div class="board-column">
          <canvas id="game" width="200" height="400" aria-label="Tetris board"></canvas>
          <div class="touch-controls" aria-label="Touch controls">
            <button type="button" class="control-btn" data-action="left" aria-label="Move left">◀</button>
            <button type="button" class="control-btn" data-action="rotate" aria-label="Rotate piece">⟳</button>
            <button type="button" class="control-btn" data-action="right" aria-label="Move right">▶</button>
            <button type="button" class="control-btn soft-drop" data-action="down" aria-label="Soft drop">▼</button>
            <button type="button" class="control-btn hard-drop" data-action="drop" aria-label="Hard drop">DROP</button>
          </div>
        </div>
        <aside class="sidebar">
          <div class="next-box">
            <h2>Next</h2>
            <canvas id="next" width="80" height="80" aria-label="Next piece"></canvas>
          </div>
          <p id="message">Ready</p>
          <ul class="controls">
            <li>Swipe left/right or tap ◀ ▶ to move</li>
            <li>Tap ⟳ or swipe up to rotate</li>
            <li>Tap ▼ or swipe down for soft drop</li>
            <li>Tap DROP for hard drop</li>
          </ul>
        </aside>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
