<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake Test Game</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="phone-shell">
    <div class="brand">3310</div>
    <div class="speaker"></div>
    <section class="screen-wrap">
      <div class="screen-header">
        <span>SNAKE II</span>
        <span>Score <strong id="score">0</strong></span>
      </div>
      <canvas id="game" width="336" height="336" aria-label="Snake game board"></canvas>
      <p id="message">Use arrows, WASD, or pad.</p>
    </section>
    <button id="restart" class="softkey">Restart</button>
    <div class="controls" aria-label="Mobile controls">
      <button class="control up" data-dir="up">▲</button>
      <div class="controls-row">
        <button class="control" data-dir="left">◀</button>
        <button class="control center" data-dir="down">●</button>
        <button class="control" data-dir="right">▶</button>
      </div>
      <button class="control down-wide" data-dir="down">▼</button>
    </div>
    <div class="keypad-grid" aria-hidden="true">
      <span></span><span></span><span></span>
      <span></span><span></span><span></span>
      <span></span><span></span><span></span>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
