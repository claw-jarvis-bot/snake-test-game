<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Mario</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <section class="game-panel">
      <div class="hud">
        <div>
          <p class="eyebrow">Mini platformer</p>
          <h1>Mini Mario</h1>
        </div>
        <div class="stats">
          <span>Mynt: <strong id="score">0</strong></span>
          <span>Liv: <strong id="lives">3</strong></span>
          <button id="restart" type="button">Starta om</button>
        </div>
      </div>

      <div class="game-wrap">
        <canvas id="game" width="960" height="540" aria-label="Mini Mario spel"></canvas>
        <aside class="sidebar">
          <p id="message">Spring till flaggan och samla mynt.</p>
          <ul class="controls">
            <li>Piltangenter eller A/D för att röra dig</li>
            <li>W, pil upp eller space för att hoppa</li>
            <li>Hoppa på fiender för att besegra dem</li>
          </ul>
        </aside>
      </div>

      <div class="touch-controls" aria-label="Touch controls">
        <button type="button" class="control-btn" data-action="left">◀</button>
        <button type="button" class="control-btn" data-action="jump">⤒</button>
        <button type="button" class="control-btn" data-action="right">▶</button>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
