<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake Test Game</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="phone-shell">
    <div class="phone-highlight"></div>
    <header class="phone-top">
      <div class="brand">NOKIA</div>
      <div class="earpiece"></div>
    </header>

    <section class="screen-cradle">
      <div class="screen-bezel">
        <div class="screen-meta">
          <span>SNAKE</span>
          <span>SCORE <strong id="score">0</strong></span>
        </div>
        <canvas id="game" width="84" height="48" aria-label="Snake game board"></canvas>
        <p id="message">READY</p>
      </div>
    </section>

    <section class="action-row">
      <span class="action-label">Select</span>
      <button id="restart" class="softkey control-start">START</button>
      <span class="action-label right">Back</span>
    </section>

    <section class="nav-pad" aria-label="Mobile controls">
      <button class="nav-button nav-up control" data-dir="up">▲</button>
      <div class="nav-middle">
        <button class="nav-button nav-left control" data-dir="left">◀</button>
        <button class="nav-button nav-center control" data-dir="down">OK</button>
        <button class="nav-button nav-right control" data-dir="right">▶</button>
      </div>
      <button class="nav-button nav-down control" data-dir="down">▼</button>
    </section>

    <section class="keypad" aria-hidden="true">
      <button class="key"><b>1</b></button>
      <button class="key"><b>2</b><small>ABC</small></button>
      <button class="key"><b>3</b><small>DEF</small></button>
      <button class="key"><b>4</b><small>GHI</small></button>
      <button class="key"><b>5</b><small>JKL</small></button>
      <button class="key"><b>6</b><small>MNO</small></button>
      <button class="key"><b>7</b><small>PQRS</small></button>
      <button class="key"><b>8</b><small>TUV</small></button>
      <button class="key"><b>9</b><small>WXYZ</small></button>
      <button class="key"><b>*</b></button>
      <button class="key"><b>0</b><small>+</small></button>
      <button class="key"><b>#</b></button>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
