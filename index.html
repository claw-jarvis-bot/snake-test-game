<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <section class="game-panel">
      <div class="hud">
        <h1>Tetris</h1>
        <div class="stats">
          <span>Score: <strong id="score">0</strong></span>
          <button id="restart">Restart</button>
        </div>
      </div>

      <div class="game-wrap">
        <canvas id="game" width="200" height="400" aria-label="Tetris board"></canvas>
        <aside class="sidebar">
          <div class="next-box">
            <h2>Next</h2>
            <canvas id="next" width="80" height="80" aria-label="Next piece"></canvas>
          </div>
          <p id="message">Ready</p>
          <ul class="controls">
            <li>← → Move</li>
            <li>↑ Rotate</li>
            <li>↓ Soft drop</li>
            <li>Space Hard drop</li>
          </ul>
        </aside>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
