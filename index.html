<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake Test Game</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="phone-shell">
    <div class="antenna-shadow"></div>
    <div class="top-cap">
      <div class="brand">NOKIA</div>
      <div class="speaker"></div>
    </div>

    <section class="screen-wrap">
      <div class="screen-glass">
        <div class="screen-header">
          <span>SNAKE</span>
          <span><strong id="score">0</strong></span>
        </div>
        <canvas id="game" width="84" height="48" aria-label="Snake game board"></canvas>
        <p id="message">READY</p>
      </div>
    </section>

    <div class="softkeys">
      <span class="softkey-label left-label">Select</span>
      <button id="restart" class="softkey">START</button>
      <span class="softkey-label right-label">Back</span>
    </div>

    <div class="nav-cluster" aria-label="Mobile controls">
      <button class="nav-btn nav-up control up" data-dir="up">▲</button>
      <div class="nav-middle controls-row">
        <button class="nav-btn control" data-dir="left">◀</button>
        <button class="nav-btn nav-center control center" data-dir="down">OK</button>
        <button class="nav-btn control" data-dir="right">▶</button>
      </div>
      <button class="nav-btn nav-down control down-wide" data-dir="down">▼</button>
    </div>

    <div class="keypad-grid" aria-hidden="true">
      <span><b>1</b><small>&nbsp;</small></span><span><b>2</b><small>ABC</small></span><span><b>3</b><small>DEF</small></span>
      <span><b>4</b><small>GHI</small></span><span><b>5</b><small>JKL</small></span><span><b>6</b><small>MNO</small></span>
      <span><b>7</b><small>PQRS</small></span><span><b>8</b><small>TUV</small></span><span><b>9</b><small>WXYZ</small></span>
      <span><b>*</b><small>&nbsp;</small></span><span><b>0</b><small>+</small></span><span><b>#</b><small>&nbsp;</small></span>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
